<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="100%" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <text x="450" y="22" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Sprint 3 — Comportamiento: fotos en MySQL y cadena de integridad</text>

  <rect x="18" y="40" width="864" height="270" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="62" font-size="12" font-weight="700" fill="#0f172a">A. Publicación con fotos (multipart, máximo 22)</text>

  <rect x="34" y="80" width="150" height="62" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="109" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Navegador</text>
  <text x="109" y="122" text-anchor="middle" font-size="10" fill="#475569">hasta 22 fotos</text>

  <rect x="214" y="80" width="190" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="309" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">web/handlers</text>
  <text x="309" y="122" text-anchor="middle" font-size="10" fill="#475569">valida nº, tipo real y tamaño</text>

  <rect x="434" y="80" width="190" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="529" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Service.SavePhoto</text>
  <text x="529" y="122" text-anchor="middle" font-size="10" fill="#475569">genera el id y delega</text>

  <rect x="654" y="80" width="210" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="759" y="104" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">MySQL · photos</text>
  <text x="759" y="122" text-anchor="middle" font-size="10" fill="#475569">LONGBLOB + content_type</text>

  <line x1="184" y1="111" x2="214" y2="111" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="404" y1="111" x2="434" y2="111" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="624" y1="111" x2="654" y2="111" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="214" y="180" width="190" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="309" y="204" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Service.CreatePublication</text>
  <text x="309" y="222" text-anchor="middle" font-size="10" fill="#475569">asocia URLs y estado PENDIENTE</text>

  <rect x="434" y="180" width="210" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="539" y="204" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">MySQL · publications</text>
  <text x="539" y="222" text-anchor="middle" font-size="10" fill="#475569">publicación + URLs de fotos</text>

  <rect x="674" y="180" width="190" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="769" y="204" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">GET /media/:id</text>
  <text x="769" y="222" text-anchor="middle" font-size="10" fill="#475569">sirve desde photos</text>

  <path d="M309 142 L309 180" fill="none" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="317" y="164" font-size="9" fill="#334155">URLs</text>
  <line x1="404" y1="211" x2="434" y2="211" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M759 142 L759 160 L769 160 L769 180" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="778" y="164" font-size="9" fill="#059669">lee</text>

  <rect x="34" y="258" width="830" height="38" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="449" y="281" text-anchor="middle" font-size="10.5" fill="#0f172a">Si la publicación falla tras guardar fotos, el handler elimina las fotos recién insertadas (sin dejar residuos).</text>

  <rect x="18" y="330" width="864" height="300" rx="10" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="34" y="352" font-size="12" font-weight="700" fill="#0f172a">B. Cadena de integridad de la auditoría (Accounting)</text>

  <rect x="34" y="370" width="180" height="60" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <text x="124" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Operación (AAA)</text>
  <text x="124" y="412" text-anchor="middle" font-size="10" fill="#475569">éxito o fallo</text>

  <rect x="244" y="370" width="190" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="339" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Service.logAction</text>
  <text x="339" y="412" text-anchor="middle" font-size="10" fill="#475569">crea la entrada de traza</text>

  <rect x="464" y="370" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="564" y="390" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">SaveAuditLog</text>
  <text x="564" y="406" text-anchor="middle" font-size="10" fill="#475569">transacción · audit_state</text>
  <text x="564" y="421" text-anchor="middle" font-size="10" fill="#475569">prev_hash ← último hash</text>

  <rect x="694" y="370" width="170" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="779" y="394" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">MySQL · audit</text>
  <text x="779" y="412" text-anchor="middle" font-size="10" fill="#475569">entrada encadenada</text>

  <line x1="214" y1="400" x2="244" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="434" y1="400" x2="464" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="664" y1="400" x2="694" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="564" y="458" text-anchor="middle" font-size="10.5" fill="#0f172a">hashₙ = SHA-256( hashₙ₋₁ ‖ id ‖ fecha ‖ acción ‖ usuario ‖ rol ‖ éxito ‖ detalles )</text>

  <rect x="244" y="478" width="190" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="339" y="502" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Admin /admin/audit</text>
  <text x="339" y="520" text-anchor="middle" font-size="10" fill="#475569">solicita la traza</text>

  <rect x="464" y="478" width="200" height="60" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="564" y="502" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">VerifyAuditIntegrity</text>
  <text x="564" y="520" text-anchor="middle" font-size="10" fill="#475569">recalcula cadena + audit_state</text>

  <rect x="694" y="478" width="170" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="779" y="502" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Resultado</text>
  <text x="779" y="520" text-anchor="middle" font-size="10" fill="#475569">íntegra / alterada</text>

  <line x1="434" y1="508" x2="464" y2="508" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="664" y1="508" x2="694" y2="508" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="34" y="556" width="830" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
  <text x="449" y="577" text-anchor="middle" font-size="10.5" fill="#0f172a">La transacción y el bloqueo de audit_state serializan las escrituras; el último hash detecta borrados al final.</text>
  <text x="449" y="595" text-anchor="middle" font-size="10.5" fill="#0f172a">Cualquier alteración de la tabla audit rompe la cadena y la vista la marca como «alterada».</text>
</svg>
