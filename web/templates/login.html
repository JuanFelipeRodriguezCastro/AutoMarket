{{template "header" .}}
<div class="auth-wrap">
	<div class="card auth-card">
		<div class="heading">
			<h1>Hola de nuevo</h1>
			<span>Ingresá para gestionar tus publicaciones.</span>
		</div>
		{{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
		<form method="post" action="/login">
			<label class="field">Usuario
				<input id="username" name="username" autocomplete="username" required autofocus>
			</label>
			<label class="field">Contraseña
				<input id="password" name="password" type="password" autocomplete="current-password" required>
			</label>
			<button class="btn btn-dark btn-lg" type="submit">Entrar</button>
		</form>
		<div class="auth-switch"><span>¿No tenés cuenta?</span><a href="/register">Registrate</a></div>
	</div>
</div>
{{template "footer" .}}
