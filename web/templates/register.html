{{template "header" .}}
<div class="auth-wrap">
	<div class="card auth-card">
		<div class="heading">
			<h1>Creá tu cuenta</h1>
			<span>Es gratis y te permite publicar autos en minutos.</span>
		</div>
		{{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}
		<form method="post" action="/register">
			<label class="field">Usuario
				<input id="username" name="username" autocomplete="username" required autofocus>
			</label>
			<label class="field">Contraseña
				<input id="password" name="password" type="password" autocomplete="new-password" required>
			</label>
			<button class="btn btn-dark btn-lg" type="submit">Crear cuenta de vendedor</button>
		</form>
		<div class="auth-switch"><span>¿Ya tenés cuenta?</span><a href="/login">Iniciá sesión</a></div>
	</div>
</div>
{{template "footer" .}}
